name: eureka
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_flutter: ^1.1.0
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons: # dart run flutter_launcher_icons
  android: true
  ios: true
  image_path: assets/icons/app.png
  adaptive_icon_background: "#2D2636"
  adaptive_icon_foreground: assets/icons/app.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  fonts:
    - family: SourGummy
      fonts:
        - asset: assets/fonts/SourGummy-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourGummy-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourGummy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourGummy-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourGummy-ExtraBold.ttf
          weight: 800

  assets:
    - assets/icons/
